name: Tests
on:
  push:
    branches:
      - main
      - "v[0-9]*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  packaging-tests:
    name: Test Static Archive Packaging
    runs-on: ubuntu-latest
    env:
      LLVM_AR: llvm-ar-19
      LLVM_NM: llvm-nm-19
      LD_LLD: ld.lld-19
      LLVM_CLANG: clang-19
    steps:
      - uses: actions/checkout@v7
      - name: Install archive packaging tools
        run: sudo apt-get update && sudo apt-get install -y llvm-19 lld-19 clang-19
      - name: Test archive packaging
        run: python3 -m unittest discover -s scripts -p '*_test.py'

  go-tests:
    name: Test Pre-Built Libs
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        version: [1.24]
        os:
          - macos-15-intel
          - macos-latest
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.version }}
      - name: Setup workspace
        run: cp go.work.dev go.work
      - name: Test ${{ matrix.os }}
        run: |
          go test
          go test -tags=debug_bindings,duckdb_arrow

  dynamic-lib-tests:
    name: Test Dynamic Libs
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        version: [1.24]
        os:
          - macos-15-intel
          - macos-latest
          - ubuntu-latest
          - ubuntu-24.04-arm
        include:
          - os: "macos-15-intel"
            platform: "osx-universal"
            filepath: "DYLD_LIBRARY_PATH"
          - os: "macos-latest"
            platform: "osx-universal"
            filepath: "DYLD_LIBRARY_PATH"
          - os: "ubuntu-latest"
            platform: "linux-amd64"
            filepath: "LD_LIBRARY_PATH"
          - os: "ubuntu-24.04-arm"
            platform: "linux-arm64"
            filepath: "LD_LIBRARY_PATH"
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.version }}
      - name: Test ${{ matrix.platform }}
        run: |
          make fetch.dynamic.lib ARTIFACT_PLATFORM=${{ matrix.platform }}
          CGO_ENABLED=1 CGO_LDFLAGS="-L${SRCDIR}dynamic-dir" ${{ matrix.filepath }}=${SRCDIR}dynamic-dir go test -tags=duckdb_use_lib
          CGO_ENABLED=1 CGO_LDFLAGS="-L${SRCDIR}dynamic-dir" ${{ matrix.filepath }}=${SRCDIR}dynamic-dir go test -tags=duckdb_use_lib,debug_bindings
          CGO_ENABLED=1 CGO_LDFLAGS="-L${SRCDIR}dynamic-dir" ${{ matrix.filepath }}=${SRCDIR}dynamic-dir go test -tags=duckdb_use_lib,debug_bindings,duckdb_arrow

  static-lib-tests:
    name: Test Static Libs
    runs-on: ${{ matrix.os }}
    env:
      DUCKDB_LDFLAGS: >-
        -lduckdb_static_extension_loader -lduckdb_httplib
        -lduckdb_loadable_extensions -lautocomplete_extension
        -lcore_functions_extension -licu_extension -ljson_extension
        -lparquet_extension -ltpcds_extension -ltpch_extension -lduckdb_static
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        version: [1.24]
        os:
          - macos-15-intel
          - macos-latest
          - ubuntu-latest
          - ubuntu-24.04-arm
        include:
          - os: "macos-15-intel"
            dir: "darwin-amd64"
            flags: "-lc++"
          - os: "macos-latest"
            dir: "darwin-arm64"
            flags: "-lc++"
          - os: "ubuntu-latest"
            dir: "linux-amd64"
            flags: "-lstdc++ -lm -ldl"
          - os: "ubuntu-24.04-arm"
            dir: "linux-arm64"
            flags: "-lstdc++ -lm -ldl"
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.version }}
      # Link the prebuilt loader as an external archive to exercise the same
      # entry point used by custom static builds.
      - name: Build static extension loader
        run: |
          cc -c -Iinclude static_extension_loader.c -o "$RUNNER_TEMP/static_extension_loader.o"
          ar rcs lib/${{ matrix.dir }}/libduckdb_static_extension_loader.a "$RUNNER_TEMP/static_extension_loader.o"
      - name: Test ${{ matrix.dir }}
        run: |
          CGO_ENABLED=1 CGO_LDFLAGS="$DUCKDB_LDFLAGS ${{ matrix.flags }} -L${SRCDIR}lib/${{ matrix.dir }}/" go test -tags=duckdb_use_static_lib
          CGO_ENABLED=1 CGO_LDFLAGS="$DUCKDB_LDFLAGS ${{ matrix.flags }} -L${SRCDIR}lib/${{ matrix.dir }}/" go test -tags=duckdb_use_static_lib,debug_bindings
          CGO_ENABLED=1 CGO_LDFLAGS="$DUCKDB_LDFLAGS ${{ matrix.flags }} -L${SRCDIR}lib/${{ matrix.dir }}/" go test -tags=duckdb_use_static_lib,debug_bindings,duckdb_arrow
