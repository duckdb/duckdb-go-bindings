name: Tests
on:
  push:
    branches:
      - main
      - "v[0-9]*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  go-tests:
    name: Test Pre-Built Libs
    runs-on: &runner ${{ github.repository_owner == 'duckdb' && matrix.namespace || matrix.github }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        platform:
          - darwin-amd64
          - darwin-arm64
          - linux-amd64
          - linux-arm64
          - windows-amd64
        # Keep Intel macOS and Windows AMD64 coverage after merge without delaying PR checks.
        exclude: &skip-on-pr ${{ fromJSON(github.event_name == 'pull_request' && '[{"platform":"darwin-amd64"},{"platform":"windows-amd64"}]' || '[]') }}
        include:
          # Includes run after exclusions; do not reintroduce skipped platforms on PRs.
          # Intel has no Namespace profile, so runs-on falls back to github.
          - &darwin-amd64 ${{ fromJSON(github.event_name == 'pull_request' && '[]' || '[{"platform":"darwin-amd64","github":"macos-15-intel"}]') }}
          - &darwin-arm64 { platform: darwin-arm64, github: macos-26, namespace: namespace-profile-macos-arm64 }
          - &linux-amd64 { platform: linux-amd64, github: ubuntu-24.04, namespace: namespace-profile-linux-small }
          - &linux-arm64 { platform: linux-arm64, github: ubuntu-24.04-arm, namespace: namespace-profile-linux-arm64-small }
          - &windows-amd64 ${{ fromJSON(github.event_name == 'pull_request' && '[]' || '[{"platform":"windows-amd64","github":"windows-2025","namespace":"namespace-profile-windows-x64"}]') }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test ${{ matrix.platform }}
        run: make test

  dynamic-lib-tests:
    name: Test Dynamic Libs
    runs-on: *runner
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        platform:
          - darwin-amd64
          - darwin-arm64
          - linux-amd64
          - linux-arm64
          - windows-amd64
          - windows-arm64
        exclude: *skip-on-pr
        include:
          - *darwin-amd64
          - *darwin-arm64
          - *linux-amd64
          - *linux-arm64
          - *windows-amd64
          - &windows-arm64 { platform: windows-arm64, github: windows-11-vs2026-arm }
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - &install-arm64-compiler
        name: Install ARM64 C compiler
        if: matrix.platform == 'windows-arm64'
        shell: pwsh
        run: |
          # The Go matcher misclassifies Clang notes in Arrow's cgo code as errors.
          Write-Output '::remove-matcher owner=go::'
          $name = "llvm-mingw-20261020-ucrt-aarch64"
          $archive = "$env:RUNNER_TEMP/$name.zip"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/$name.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne "8f24fedd0b75c674c6c83dec2d76a7ac31a690120212843a17e465ef49854f69") {
            throw "llvm-mingw checksum mismatch"
          }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP/$name/bin" >> $env:GITHUB_PATH
          "CC=aarch64-w64-mingw32-clang" >> $env:GITHUB_ENV
          "CXX=aarch64-w64-mingw32-clang++" >> $env:GITHUB_ENV
      - name: Test ${{ matrix.platform }}
        run: ./scripts/test.sh dynamic

  static-lib-tests:
    name: Test Static Libs
    runs-on: *runner
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        platform:
          - darwin-amd64
          - darwin-arm64
          - linux-amd64
          - linux-arm64
          - windows-amd64
          - windows-arm64
        exclude: *skip-on-pr
        include:
          - *darwin-amd64
          - *darwin-arm64
          - *linux-amd64
          - *linux-arm64
          - *windows-amd64
          - *windows-arm64
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - *install-arm64-compiler
      - name: Locate ARM64 Microsoft runtime libraries
        if: matrix.platform == 'windows-arm64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -version '[18.0,19.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (!$vs) { throw "Visual Studio 2026 ARM64 tools are required" }
          $tools = (Get-Content "$vs/VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt").Trim()
          $sdkRoot = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots').KitsRoot10
          $sdk = Get-ChildItem "${sdkRoot}Lib" -Directory |
            Where-Object { Test-Path "$($_.FullName)/ucrt/arm64/libucrt.lib" } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (!$sdk) { throw "Windows SDK ARM64 libraries are required" }
          $paths = @{
            MSVC_LIB_DIR = "$vs/VC/Tools/MSVC/$tools/lib/arm64"
            UCRT_LIB_DIR = "$($sdk.FullName)/ucrt/arm64"
            WINDOWS_LIB_DIR = "$($sdk.FullName)/um/arm64"
          }
          foreach ($entry in $paths.GetEnumerator()) {
            if (!(Test-Path $entry.Value)) { throw "Missing $($entry.Value)" }
            $setting = "$($entry.Key)=$($entry.Value.Replace('\', '/'))"
            Write-Host $setting
            $setting >> $env:GITHUB_ENV
          }
      - name: Test ${{ matrix.platform }}
        run: ./scripts/test.sh static
