name: Nightly
run-name: Nightly - ${{ inputs.duckdb-sha }} (${{ inputs.duckdb-version }})

on:
  # Dispatched by duckdb/duckdb-workflow-trigger on core_ready.
  workflow_dispatch:
    inputs:
      duckdb-sha:
        description: Full lowercase DuckDB commit SHA of the staging build to test
        required: true
        type: string
      duckdb-version:
        description: DuckDB version label of the staging build (e.g. v2.0.0-alpha39998)
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ inputs.duckdb-sha }}
  cancel-in-progress: true

jobs:
  nightly:
    name: DuckDB nightly (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            github: ubuntu-24.04
            namespace: namespace-profile-linux-small
          - name: macOS
            github: macos-26
            namespace: namespace-profile-macos-arm64
          - name: Windows
            github: windows-2025
            namespace: namespace-profile-windows-x64
    runs-on: ${{ github.repository_owner == 'duckdb' && matrix.namespace || matrix.github }}
    timeout-minutes: 15
    env:
      DUCKDB_SHA: ${{ inputs.duckdb-sha }}
      DUCKDB_VERSION: ${{ inputs.duckdb-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install nightly artifacts
        id: artifacts
        run: |
          # Prevent dispatch inputs from injecting extra variables through GITHUB_ENV.
          if [[ ! "$DUCKDB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::duckdb-sha must be a full lowercase hexadecimal commit SHA"
            exit 1
          fi
          if [[ ! "$DUCKDB_VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "::error::duckdb-version contains unsupported characters"
            exit 1
          fi
          base_url="https://duckdb-staging.duckdb.org/${DUCKDB_SHA:0:10}/$DUCKDB_VERSION/duckdb/duckdb/github_release"
          echo "BASE_URL=$base_url" >> "$GITHUB_ENV"
          make use.libs BASE_URL="$base_url"

      - name: Show nightly header diff
        if: always()
        run: |
          git status --short
          git diff --stat
          git diff --numstat -- include/duckdb.h

      - name: Test nightly static artifact
        if: ${{ !cancelled() && steps.artifacts.outcome == 'success' }}
        run: make test TAGS=duckdb_nightly

      - name: Test nightly dynamic artifact
        if: ${{ !cancelled() && steps.artifacts.outcome == 'success' }}
        run: make test.dynamic TAGS=duckdb_nightly
