name: Nightly
run-name: Nightly - ${{ inputs.duckdb-sha }}

on:
  # Triggered from DuckDB's NotifyExternalRepositories workflow.
  # See https://github.com/duckdb/duckdb/pull/24720 for details.
  workflow_dispatch:
    inputs:
      duckdb-sha:
        description: DuckDB commit SHA to test against
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ inputs.duckdb-sha }}
  cancel-in-progress: true

jobs:
  nightly:
    name: DuckDB nightly (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            platform: linux-amd64
            static_artifact: static-libs-linux-amd64
            dynamic_artifact: libduckdb-linux-amd64
          - name: macOS
            os: macos-latest
            platform: darwin-arm64
            static_artifact: static-libs-osx-arm64
            dynamic_artifact: libduckdb-osx-universal
          - name: Windows
            os: windows-latest
            platform: windows-amd64
            static_artifact: static-libs-windows-mingw
            dynamic_artifact: libduckdb-windows-amd64
    runs-on: ${{ matrix.os }}
    env:
      DUCKDB_SHA: ${{ inputs.duckdb-sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"

      - name: Set up workspace
        run: cp go.work.dev go.work

      - name: Install nightly artifacts
        id: artifacts
        run: |
          # macOS runners use Bash 3.2, which lacks ${value,,}. Require the
          # canonical lowercase form instead of normalizing the input.
          if [[ ! "$DUCKDB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::duckdb-sha must be a full lowercase hexadecimal commit SHA"
            exit 1
          fi

          staging_key=${DUCKDB_SHA:0:10}
          base_url="https://duckdb-staging.duckdb.org/$staging_key/duckdb/duckdb/github_release"
          echo "Installing staging artifacts from $base_url"

          make fetch.static.libs \
            PLATFORM=${{ matrix.platform }} FILENAME=${{ matrix.static_artifact }} COPY_HEADER=1 \
            BASE_URL="$base_url"
          make fetch.dynamic.lib \
            FILENAME=${{ matrix.dynamic_artifact }} \
            BASE_URL="$base_url"

      - name: Show nightly header diff
        if: always()
        run: |
          git status --short
          git diff --stat
          git diff --numstat -- include/duckdb.h

      - name: Test nightly static artifact
        if: ${{ !cancelled() && steps.artifacts.outcome == 'success' }}
        run: |
          go test -count=1 -tags=duckdb_nightly
          go test -count=1 -tags=debug_bindings
          go test -count=1 -tags=debug_bindings,duckdb_arrow

      - name: Prepare nightly dynamic linking
        id: dynamic
        if: ${{ !cancelled() && steps.artifacts.outcome == 'success' }}
        run: |
          # Both artifacts ship duckdb.h; the static one is already in include/.
          cmp lib/${{ matrix.platform }}/duckdb.h dynamic-dir/duckdb.h

          library_path="$PWD/dynamic-dir"
          if [[ "$RUNNER_OS" == Windows ]]; then
            library_path=$(cygpath -m "$library_path")
          fi
          cgo_ldflags="-L$library_path"
          case "$RUNNER_OS" in
            Linux)
              echo "LD_LIBRARY_PATH=$library_path${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
              ;;
            macOS)
              # SIP strips DYLD_* when /bin/bash starts a step, so GITHUB_ENV
              # cannot carry a runtime library path here. Bake in an rpath at
              # link time instead; libduckdb.dylib installs as @rpath/....
              cgo_ldflags="$cgo_ldflags -Wl,-rpath,$library_path"
              ;;
            Windows)
              echo "$library_path" >> "$GITHUB_PATH"
              ;;
            *)
              echo "::error::Unsupported runner OS: $RUNNER_OS"
              exit 1
              ;;
          esac
          echo "cgo_ldflags=$cgo_ldflags" >> "$GITHUB_OUTPUT"

      - name: Test nightly dynamic artifact
        if: ${{ !cancelled() && steps.dynamic.outcome == 'success' }}
        env:
          CGO_ENABLED: "1"
          CGO_LDFLAGS: ${{ steps.dynamic.outputs.cgo_ldflags }}
        run: |
          go test -count=1 -tags=duckdb_use_lib,duckdb_nightly
          go test -count=1 -tags=duckdb_use_lib,debug_bindings
          go test -count=1 -tags=duckdb_use_lib,debug_bindings,duckdb_arrow
