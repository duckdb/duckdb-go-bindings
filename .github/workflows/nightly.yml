name: Nightly
run-name: Nightly - ${{ inputs.duckdb-sha }}

on:
  # Triggered from DuckDB's NotifyExternalRepositories workflow.
  # See https://github.com/duckdb/duckdb/pull/24720 for details.
  workflow_dispatch:
    inputs:
      duckdb-sha:
        description: DuckDB commit SHA to test against
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.duckdb-sha }}
  cancel-in-progress: true

jobs:
  nightly:
    name: DuckDB nightly
    runs-on: ubuntu-latest
    env:
      DUCKDB_SHA: ${{ inputs.duckdb-sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"

      - name: Set up workspace
        run: cp go.work.dev go.work

      - name: Download nightly artifacts
        id: artifacts
        run: |
          if [[ ! "$DUCKDB_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::duckdb-sha must be a full hexadecimal commit SHA"
            exit 1
          fi

          staging_key_length=10
          staging_key=${DUCKDB_SHA,,}
          staging_key=${staging_key:0:$staging_key_length}
          staging_base="https://duckdb-staging.duckdb.org/$staging_key/duckdb/duckdb/github_release"

          download_artifact() {
            artifact_name=$1
            artifact_path=$2
            artifact_url="$staging_base/$artifact_name"
            curl --fail --location --retry 5 \
              --output "$artifact_path" "$artifact_url" || {
              echo "::error::No staging artifact at $artifact_url"
              exit 1
            }
          }

          mkdir -p \
            "$RUNNER_TEMP/duckdb-artifacts/static" \
            "$RUNNER_TEMP/duckdb-artifacts/dynamic"
          download_artifact \
            static-libs-linux-amd64.zip \
            "$RUNNER_TEMP/duckdb-artifacts/static/static-libs-linux-amd64.zip"
          download_artifact \
            libduckdb-linux-amd64.zip \
            "$RUNNER_TEMP/duckdb-artifacts/dynamic/libduckdb-linux-amd64.zip"

      - name: Install nightly static artifact
        id: static
        if: ${{ !cancelled() && steps.artifacts.outcome == 'success' }}
        run: |
          rm -f lib/linux-amd64/*.a lib/linux-amd64/duckdb.h
          unzip -q \
            "$RUNNER_TEMP/duckdb-artifacts/static/static-libs-linux-amd64.zip" \
            -d lib/linux-amd64
          cp lib/linux-amd64/duckdb.h include/duckdb.h

      - name: Show nightly header diff
        if: always()
        run: |
          git status --short
          git diff --stat
          git diff --numstat -- include/duckdb.h

      - name: Test nightly static artifact
        if: ${{ !cancelled() && steps.static.outcome == 'success' }}
        run: |
          go test -count=1 -tags=duckdb_nightly
          go test -count=1 -tags=debug_bindings
          go test -count=1 -tags=debug_bindings,duckdb_arrow

      - name: Install nightly dynamic artifact
        id: dynamic
        if: ${{ !cancelled() && steps.artifacts.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/libduckdb"
          unzip -q \
            "$RUNNER_TEMP/duckdb-artifacts/dynamic/libduckdb-linux-amd64.zip" \
            -d "$RUNNER_TEMP/libduckdb"
          cmp lib/linux-amd64/duckdb.h "$RUNNER_TEMP/libduckdb/duckdb.h"
          cp "$RUNNER_TEMP/libduckdb/duckdb.h" include/duckdb.h
          {
            echo "DUCKDB_LIB_DIR=$RUNNER_TEMP/libduckdb"
            echo "LD_LIBRARY_PATH=$RUNNER_TEMP/libduckdb${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          } >> "$GITHUB_ENV"

      - name: Test nightly dynamic artifact
        if: ${{ !cancelled() && steps.dynamic.outcome == 'success' }}
        run: |
          export CGO_ENABLED=1
          export CGO_LDFLAGS="-L${DUCKDB_LIB_DIR}"
          go test -count=1 -tags=duckdb_use_lib,duckdb_nightly
          go test -count=1 -tags=duckdb_use_lib,debug_bindings
          go test -count=1 -tags=duckdb_use_lib,debug_bindings,duckdb_arrow
